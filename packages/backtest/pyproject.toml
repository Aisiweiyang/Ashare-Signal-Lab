[project]
name = "asg-backtest"
version = "0.1.0"
description = "带成本回测：可成交性检查（涨跌停/停牌/T+1）、费用、滑点、指标与 walk-forward 切分"
requires-python = ">=3.12"
dependencies = ["asg-domain", "asg-event-study", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_backtest"]
