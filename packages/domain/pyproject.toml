[project]
name = "asg-domain"
version = "0.1.0"
description = "AshareSignal Lab 核心领域模型：枚举、schema、ORM 表、时间语义、交易日历"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_domain"]
