[project]
name = "asg-event-study"
version = "0.1.0"
description = "事件研究：available_at 门控收益、异常收益、CAR、IC、显著性"
requires-python = ">=3.12"
dependencies = ["asg-domain", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_event_study"]
