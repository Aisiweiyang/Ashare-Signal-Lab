[project]
name = "asg-models"
version = "0.1.0"
description = "情绪模型 provider：词典/多数类/三分类/细粒度基线、LLM provider（mock 与 OpenAI 兼容）、结构化输出校验"
requires-python = ">=3.12"
dependencies = [
    "asg-domain",
    "asg-text-pipeline",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "jieba>=0.42",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_models"]
