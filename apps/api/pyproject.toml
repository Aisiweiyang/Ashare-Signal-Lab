[project]
name = "asg-api"
version = "0.1.0"
description = "FastAPI 服务：鉴权 RBAC、数据/标注/实验/回测 API、审计与导出"
requires-python = ">=3.12"
dependencies = [
    "asg-domain",
    "asg-text-pipeline",
    "asg-connectors",
    "asg-labeling",
    "asg-models",
    "asg-event-study",
    "asg-backtest",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asg_api"]
